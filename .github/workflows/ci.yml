name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails loudly if package.json and the lockfile disagree, which
      # is what keeps production builds reproducible.
      - run: npm ci

      - run: npm run typecheck

      # Fails if the palette in globals.css has drifted from the design tokens.
      - run: npm run verify:tokens

      # Stripe webhook signature verification is the one place where a
      # cryptographic mistake lets someone grant themselves an entitlement.
      - run: npm run verify:signature

      - run: npm run build

  secret-scan:
    name: Reject committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential patterns
        run: bash scripts/secret-scan.sh

  api:
    name: Verify API routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:api

  schema:
    name: Verify Supabase migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: npm run verify:schema
